description: "START_ABR_NN - Abrechnungsdaten Bilanzkreisabrechnung (NB)"
type: object
properties:
  stammdaten:
    type: object
    description: > 
      Informationscontainer für Stammdaten, die zur Identifizierung genutzt werden
    properties:
      MARKTLOKATION:
        type: array
        items:
          $ref: "../../../_schemas/openapi.yml#/components/schemas/Marktlokation"
      ENERGIELIEFERVERTRAG:
        type: array
        items:
          type: object
          $ref: "../../../_schemas/openapi.yml#/components/schemas/Vertrag"
      NETZNUTZUNGSVERTRAG:
        type: array
        items:
          type: object
          $ref: "../../../_schemas/openapi.yml#/components/schemas/Vertrag"
    required:
      - MARKTLOKATION
  transaktionsdaten:
    type: object
    $ref: "../../../_schemas/openapi.yml#/components/schemas/Transaktionsdaten"
    required:
      - ausfuehrungsdatum
      - vorgangsnummer 
      - absender
      - empfaenger                          
  zusatzdaten:
    type: object
    description: > 
      Informationscontainer zur Identifikation des Prozesses
    properties:
      prozessId:
        type: string
        example: "00505688-E4A2-1EDF-A0C2-C81842E2515E"
        description: Id des Dokuments / Beleges im Backend. Wird genutzt um die Antwort zuzuordnen.
      eventname:
        type: string
        example: "START_LIEFERBEGINN"
        description: Name des Events 
        enum:
          - START_LIEFERBEGINN 
    required:
      - prozessId
      - eventname    
required:
  - stammdaten
  - transaktionsdaten
  - zusatzdaten                      

